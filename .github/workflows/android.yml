name: Android CI

on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      # A permanent keystore is supplied once through repository Actions secrets.
      # Never store the signing key or its passwords in git.
      - name: Restore persistent Jacket signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          JACKET_KEYSTORE_BASE64: ${{ secrets.JACKET_KEYSTORE_BASE64 }}
          JACKET_KEYSTORE_PASSWORD: ${{ secrets.JACKET_KEYSTORE_PASSWORD }}
          JACKET_KEY_ALIAS: ${{ secrets.JACKET_KEY_ALIAS }}
          JACKET_KEY_PASSWORD: ${{ secrets.JACKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$JACKET_KEYSTORE_BASE64" ||
                -z "$JACKET_KEYSTORE_PASSWORD" ||
                -z "$JACKET_KEY_ALIAS" ||
                -z "$JACKET_KEY_PASSWORD" ]]; then
            echo "JACKET_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Persistent signing is not configured. Debug APKs from separate CI runners may not update each other."
            exit 0
          fi
          signing_dir="$RUNNER_TEMP/jacket-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$JACKET_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/jacket-release.jks"
          test -s "$signing_dir/jacket-release.jks"
          {
            echo "JACKET_SIGNING_READY=true"
            echo "JACKET_SIGNING_STORE_FILE=$signing_dir/jacket-release.jks"
            echo "JACKET_SIGNING_STORE_PASSWORD=$JACKET_KEYSTORE_PASSWORD"
            echo "JACKET_SIGNING_KEY_ALIAS=$JACKET_KEY_ALIAS"
            echo "JACKET_SIGNING_KEY_PASSWORD=$JACKET_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Uses the checked-in Gradle 9.9.1 wrapper; CI must not install a second Gradle version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run lint, unit tests and debug/release builds
        run: ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug assembleRelease

      - name: Prepare universal APK and checksum
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "Could not read app versionName" >&2
            exit 1
          fi
          if [[ "${JACKET_SIGNING_READY:-false}" == "true" ]]; then
            apk="$(find app/build/outputs/apk/release -type f -iname '*universal*.apk' -print -quit)"
            build_kind="signed-release"
          else
            apk="$(find app/build/outputs/apk/debug -type f -iname '*universal*.apk' -print -quit)"
            build_kind="debug"
          fi
          if [[ -z "$apk" ]]; then
            echo "Universal APK not found. Available APK files:" >&2
            find app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          mkdir -p dist
          output="dist/Jacket-${version_name}-main-${GITHUB_SHA:0:7}-universal-${build_kind}.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Upload universal APK artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Jacket-main-apk
          path: dist/Jacket-*.apk*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
