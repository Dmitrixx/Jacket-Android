name: Android CI

on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      # Uses the checked-in Gradle 9.9.1 wrapper; CI must not install a second Gradle version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run lint, unit tests and debug/release builds
        run: ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug assembleRelease

      - name: Prepare universal APK and checksum
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -iname '*universal*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "Universal debug APK not found. Available APK files:" >&2
            find app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          mkdir -p dist
          output="dist/Jacket-2.8.1-main-${GITHUB_SHA:0:7}-universal-debug.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Upload universal APK artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Jacket-main-apk
          path: dist/Jacket-*.apk*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
