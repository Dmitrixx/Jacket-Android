name: Lampa Android CI

on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js for Lampa assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lampa web build dependencies
        working-directory: third_party/lampa-source
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      # A permanent keystore is supplied once through repository Actions secrets.
      # Never store the signing key or its passwords in git.
      - name: Restore persistent app signing key
        id: restore_signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          JACKET_KEYSTORE_BASE64: ${{ secrets.JACKET_KEYSTORE_BASE64 }}
          JACKET_KEYSTORE_PASSWORD: ${{ secrets.JACKET_KEYSTORE_PASSWORD }}
          JACKET_KEY_ALIAS: ${{ secrets.JACKET_KEY_ALIAS }}
          JACKET_KEY_PASSWORD: ${{ secrets.JACKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$JACKET_KEYSTORE_BASE64" ||
                -z "$JACKET_KEYSTORE_PASSWORD" ||
                -z "$JACKET_KEY_ALIAS" ||
                -z "$JACKET_KEY_PASSWORD" ]]; then
            echo "JACKET_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent signing is not configured. No main-branch update APK will be uploaded."
            exit 0
          fi
          signing_dir="$RUNNER_TEMP/jacket-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$JACKET_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/jacket-release.jks"
          test -s "$signing_dir/jacket-release.jks"
          {
            echo "JACKET_SIGNING_READY=true"
            echo "JACKET_SIGNING_STORE_FILE=$signing_dir/jacket-release.jks"
            echo "JACKET_SIGNING_STORE_PASSWORD=$JACKET_KEYSTORE_PASSWORD"
            echo "JACKET_SIGNING_KEY_ALIAS=$JACKET_KEY_ALIAS"
            echo "JACKET_SIGNING_KEY_PASSWORD=$JACKET_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Uses the checked-in Gradle 9.9.1 wrapper; CI must not install a second Gradle version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run lint, unit tests and debug/release builds
        run: ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug assembleRelease

      # Publish the standalone Lampa web bundle separately from the APK.
      # Android can update these assets without reinstalling the application.
      - name: Publish Lampa web update bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle="dist/lampa-web-update.zip"
          manifest="dist/lampa-web-update.json"
          (cd app/src/main/assets/lampa && zip -qr "$GITHUB_WORKSPACE/$bundle" .)
          source_commit="$(jq -r '.sourceCommit // .commit' app/src/main/assets/lampa/build-info.json)"
          bundle_id="$(jq -r '.buildId' app/src/main/assets/lampa/build-info.json)"
          app_version="$(jq -r '.appVersion' app/src/main/assets/lampa/build-info.json)"
          zip_bytes="$(stat -c '%s' "$bundle")"
          if [[ ! "$bundle_id" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Generated Lampa web bundle identity is missing or invalid" >&2
            exit 1
          fi
          zip_sha256="$(sha256sum "$bundle" | awk '{print $1}')"
          jq -n \
            --arg buildId "$bundle_id" \
            --arg sourceCommit "$source_commit" \
            --arg versionName "$app_version" \
            --arg assetName "lampa-web-update.zip" \
            --arg sha256 "$zip_sha256" \
            --argjson sizeBytes "$zip_bytes" \
            '{schemaVersion:1, buildId:$buildId, sourceCommit:$sourceCommit, versionName:$versionName, assetName:$assetName, sha256:$sha256, sizeBytes:$sizeBytes}' \
            > "$manifest"
          tag="lampa-web-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$manifest" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$bundle" "$manifest" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Lampa web bundle ${GITHUB_SHA:0:12}" \
              --notes "Standalone Lampa web assets for in-app updates. App source revision: $GITHUB_SHA. Upstream Lampa source revision: $source_commit."
          fi

      - name: Prepare universal APK and checksum
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore_signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "Could not read app versionName" >&2
            exit 1
          fi
          apk="$(find app/build/outputs/apk/release -type f -iname '*universal*.apk' -print -quit)"
          build_kind="signed-release"
          if [[ -z "$apk" ]]; then
            echo "Lampa universal APK not found. Available APK files:" >&2
            find app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          mkdir -p dist
          output="dist/Lampa-${version_name}-main-${GITHUB_SHA:0:7}-universal-${build_kind}.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Upload universal APK artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Lampa-main-apk
          path: dist/Lampa-*.apk*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


      - name: Explain why no update APK was published
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore_signing.outputs.ready != 'true'
        shell: bash
        run: |
          {
            echo "## Update APK not published"
            echo
            echo "The build and tests completed, but the updateable APK was not uploaded because the persistent signing key is not configured."
            echo
            echo "Configure the four keystore secrets by following [docs/UPDATES.md](docs/UPDATES.md), then run this workflow again. Temporary-runner debug APKs are intentionally not published as app updates."
          } >> "$GITHUB_STEP_SUMMARY"
