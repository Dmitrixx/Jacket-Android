name: Android CI

on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      # A permanent keystore is supplied once through repository Actions secrets.
      # Never store the signing key or its passwords in git.
      - name: Restore and validate persistent Jacket signing key
        id: restore_signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          JACKET_KEYSTORE_BASE64: ${{ secrets.JACKET_KEYSTORE_BASE64 }}
          JACKET_KEYSTORE_PASSWORD: ${{ secrets.JACKET_KEYSTORE_PASSWORD }}
          JACKET_KEY_ALIAS: ${{ secrets.JACKET_KEY_ALIAS }}
          JACKET_KEY_PASSWORD: ${{ secrets.JACKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mark_signing_unready() {
            echo "JACKET_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          }
          if [[ -z "$JACKET_KEYSTORE_BASE64" ||
                -z "$JACKET_KEYSTORE_PASSWORD" ||
                -z "$JACKET_KEY_ALIAS" ||
                -z "$JACKET_KEY_PASSWORD" ]]; then
            mark_signing_unready
            echo "::warning::Persistent signing secrets are not configured. CI will build without signing and will not upload an update APK."
            exit 0
          fi
          signing_dir="$RUNNER_TEMP/jacket-signing"
          mkdir -p "$signing_dir"
          keystore="$signing_dir/jacket-release.jks"
          if ! (printf '%s' "$JACKET_KEYSTORE_BASE64" | base64 --decode > "$keystore" 2>/dev/null) || [[ ! -s "$keystore" ]]; then
            mark_signing_unready
            echo "::warning::Persistent signing keystore could not be decoded or validated. CI will build without signing; no update APK will be uploaded."
            exit 0
          fi
          probe_source="$signing_dir/signing-probe.txt"
          probe_jar="$signing_dir/signing-probe.jar"
          probe_signed="$signing_dir/signing-probe-signed.jar"
          printf 'Jacket signing validation probe\n' > "$probe_source"
          if ! jar --create --file "$probe_jar" -C "$signing_dir" signing-probe.txt >/dev/null 2>&1 ||
             ! jarsigner -keystore "$keystore" -storepass "$JACKET_KEYSTORE_PASSWORD" -keypass "$JACKET_KEY_PASSWORD" -signedjar "$probe_signed" "$probe_jar" "$JACKET_KEY_ALIAS" >/dev/null 2>&1 ||
             ! jarsigner -verify "$probe_signed" >/dev/null 2>&1; then
            mark_signing_unready
            rm -f "$probe_source" "$probe_jar" "$probe_signed"
            echo "::warning::Persistent signing key validation failed (keystore, alias or private-key password). CI will continue without signing and will not upload an update APK. Secret values are not logged."
            exit 0
          fi
          rm -f "$probe_source" "$probe_jar" "$probe_signed"
          {
            echo "JACKET_SIGNING_READY=true"
            echo "JACKET_SIGNING_STORE_FILE=$keystore"
            echo "JACKET_SIGNING_STORE_PASSWORD=$JACKET_KEYSTORE_PASSWORD"
            echo "JACKET_SIGNING_KEY_ALIAS=$JACKET_KEY_ALIAS"
            echo "JACKET_SIGNING_KEY_PASSWORD=$JACKET_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Uses the checked-in Gradle 9.9.1 wrapper; CI must not install a second Gradle version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run lint, unit tests and debug/release builds
        run: ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug assembleRelease

      - name: Prepare universal APK and checksum
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore_signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "Could not read app versionName" >&2
            exit 1
          fi
          apk="$(find app/build/outputs/apk/release -type f -iname '*universal*.apk' -print -quit)"
          build_kind="signed-release"
          if [[ -z "$apk" ]]; then
            echo "Universal APK not found. Available APK files:" >&2
            find app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          mkdir -p dist
          output="dist/Jacket-${version_name}-main-${GITHUB_SHA:0:7}-universal-${build_kind}.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Upload universal APK artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jacket-main-apk
          path: dist/Jacket-*.apk*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


      - name: Explain why no update APK was published
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore_signing.outputs.ready != 'true'
        shell: bash
        run: |
          {
            echo "## Update APK not published"
            echo
            echo "The build and tests completed, but the update APK was not uploaded because the persistent signing secrets are missing or failed validation."
            echo
            echo "Configure the four keystore secrets by following [docs/UPDATES.md](docs/UPDATES.md), then run this workflow again. Temporary-runner debug APKs are intentionally not published as app updates."
          } >> "$GITHUB_STEP_SUMMARY"
