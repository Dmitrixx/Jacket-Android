name: Vendor pinned Lampa source

on:
  push:
    branches:
      - feat/lampa-source-vendor-20261123
    paths:
      - .github/workflows/vendor-lampa-source.yml

permissions:
  contents: write

jobs:
  vendor-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jacket experiment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: jacket

      - name: Checkout the exact Lampa source revision supplied for this work
        uses: actions/checkout@v4
        with:
          repository: yumata/lampa-source
          ref: e583e42238587b2b85afa9f386e9b41adfc16f35
          path: lampa-upstream
          fetch-depth: 1

      - name: Copy the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jacket/third_party/lampa-source
          rsync -a --delete --exclude='.git' lampa-upstream/ jacket/third_party/lampa-source/

          test -s jacket/third_party/lampa-source/LICENSE
          test -s jacket/third_party/lampa-source/src/app.js
          test -s jacket/third_party/lampa-source/gulpfile.js

          file_count="$(find jacket/third_party/lampa-source -type f | wc -l | tr -d ' ')"
          echo "Vendored Lampa files: ${file_count}"
          test "${file_count}" -gt 990
          test "${file_count}" -lt 1100

          git -C jacket config user.name "github-actions[bot]"
          git -C jacket config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C jacket add -f third_party/lampa-source
          if git -C jacket diff --cached --quiet; then
            echo "Lampa source is already present at the pinned revision."
            exit 0
          fi
          git -C jacket commit -m "vendor: add complete Lampa source tree"
          git -C jacket push origin "HEAD:${GITHUB_REF_NAME}"
